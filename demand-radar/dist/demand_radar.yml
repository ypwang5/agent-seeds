app:
  name: 需求雷达
  description: 领域 → 抓 HN / GitHub / V2EX 讨论 + App Store 差评（近期为主）→ 需求判定（原话核对）→ 痛点聚类打分 → 竞品调研（内核 MCP）
  icon: 📡
  icon_background: '#E0F2FE'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      data:
        selected: false
        desc: ''
        type: start
        title: 开始
        variables:
        - variable: topic
          label: 领域（如：记账、简历工具、家庭网络）
          type: text-input
          required: true
          max_length: 50
          options: []
        - variable: months
          label: 时间范围（近几个月，默认 12）
          type: number
          required: false
          options: []
      position:
        x: 40
        y: 200
      positionAbsolute:
        x: 40
        y: 200
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: llm_q
      type: custom
      data:
        selected: false
        desc: ''
        type: llm
        title: 扩展检索词
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: |-
            你帮独立开发者在技术社区里找真实需求。把用户给的领域，改写成两组搜索关键词：
            - en：2～3 个英文单词，用于 Hacker News 和 GitHub Issues（GitHub 要求每个词都出现在标题里，词越多搜到越少），偏"问题/工具"说法（如 expense tracker）；
            - zh：2～4 个中文词，用于 V2EX 和 App Store（如 记账 软件）。
            只输出 JSON：{"en": "...", "zh": "..."}
        - role: user
          text: 领域：{{#start.topic#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory: null
        structured_output_enabled: false
        reasoning_format: separated
        retry_config: &id001
          enabled: true
          max_retries: 2
          retry_interval: 2000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      position:
        x: 340
        y: 200
      positionAbsolute:
        x: 340
        y: 200
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: q
      type: custom
      data:
        selected: false
        desc: ''
        type: code
        title: 解析检索词
        code_language: python3
        code: |
          def main(llm_text: str, topic: str) -> dict:
              """解析"扩展检索词"节点的 JSON；解析失败就退回用原始领域词，不让整个流程断掉。"""
              import json
              import re
              m = re.search(r"\{.*\}", llm_text or "", re.S)
              try:
                  data = json.loads(m.group()) if m else {}
              except ValueError:
                  data = {}
              en = str(data.get("en") or topic).strip()[:80]
              zh = str(data.get("zh") or topic).strip()[:40]
              return {"en": en, "zh": zh}
        variables:
        - variable: llm_text
          value_selector:
          - llm_q
          - text
        - variable: topic
          value_selector:
          - start
          - topic
        outputs:
          en:
            type: string
            children: null
          zh:
            type: string
            children: null
      position:
        x: 640
        y: 200
      positionAbsolute:
        x: 640
        y: 200
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: win
      type: custom
      data:
        selected: false
        desc: ''
        type: code
        title: 时间窗
        code_language: python3
        code: |
          def main(months) -> dict:
              """时间窗：since = 新帖的起点（默认近 12 个月）；alive = 老帖"还活着"的门槛（近 6 个月内有回复）。
              各来源接口要的格式不同（HN、V2EX 要时间戳，GitHub 要日期），这里一次算好。"""
              import time
              try:
                  months = min(max(int(months or 12), 1), 60)
              except (TypeError, ValueError):
                  months = 12
              now = int(time.time())
              since_ts = now - months * 30 * 86400
              alive_ts = now - min(months, 6) * 30 * 86400
              day = lambda ts: time.strftime("%Y-%m-%d", time.gmtime(ts))
              return {"months": months, "since_ts": since_ts, "since_date": day(since_ts),
                      "alive_ts": alive_ts, "alive_date": day(alive_ts)}
        variables:
        - variable: months
          value_selector:
          - start
          - months
        outputs:
          months:
            type: number
            children: null
          since_ts:
            type: number
            children: null
          since_date:
            type: string
            children: null
          alive_ts:
            type: number
            children: null
          alive_date:
            type: string
            children: null
      position:
        x: 640
        y: 360
      positionAbsolute:
        x: 640
        y: 360
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
