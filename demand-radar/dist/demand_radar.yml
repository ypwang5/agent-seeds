            你是产品经理。下面是"{{#start.topic#}}"领域里已经核对过原话的需求，每条以 [P编号] 开头。
            把说的是同一件事的需求归成痛点（3～6 个，宁可合并也不要拆太细；只有一条证据的痛点也可以保留）。
            注意：同一个 App 的差评说的是那个 App 自己的毛病时，要概括成用户的通用需求（如"某 App 广告太多"→"想要无广告的记账工具"）。每个痛点输出：
            - name：不超过 12 字；
            - who：谁在痛（人群/场景），只根据原话推断；
            - description：一两句话说清痛点，只用原话里有的信息；
            - workaround：原话里提到的现有土办法或替代方案，没有就填空字符串；
            - pain：痛度 1～5（5 = 严重影响工作/花钱/反复发生，1 = 顺口一提）；
            - evidence：属于这个痛点的需求编号列表，每个编号只能归到一个痛点。

            只输出 JSON 数组：[{"name": "...", "who": "...", "description": "...", "workaround": "...", "pain": 3, "evidence": ["P1", "P5"]}]
